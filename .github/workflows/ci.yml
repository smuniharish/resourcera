name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --locked --no-default-groups --group test pytest -m "not examples and not benchmark"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyrefly check
      - run: uv run --locked pytest --cov=resourcera --cov-branch

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --no-default-groups
      - run: uv run --locked --no-default-groups python -c "import importlib.util, sys, resourcera; assert importlib.util.find_spec('pynvml') is None; assert 'pynvml' not in sys.modules; print(resourcera.__version__)"
      - run: uv pip check

  nvidia-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --no-default-groups --group test --extra nvidia
      - run: uv run --locked --no-default-groups --group test --extra nvidia python -c "import importlib.util; assert importlib.util.find_spec('pynvml') is not None"
      - run: uv run --locked --no-default-groups --group test --extra nvidia pytest tests/test_accelerators.py tests/test_models.py
      - run: uv pip check

  lowest-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv sync --no-default-groups --group test --resolution lowest-direct
      - run: uv run --no-default-groups --group test --resolution lowest-direct pytest -m "not examples and not benchmark"
      - run: uv pip check

  docs-and-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: uv sync --locked --group docs
      - run: uv run --locked --group docs zensical build --strict
      - run: uv run --locked python scripts/check_site_links.py
      - run: node scripts/render-diagrams.mjs --check
      - run: npm install --global --ignore-scripts --no-audit --no-fund @mermaid-js/mermaid-cli@12.2.0
      - name: Validate Mermaid sources with pinned renderer
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p "$RUNNER_TEMP/resourcera-diagrams"
          for source in diagrams/*.mmd; do
            name="$(basename "$source" .mmd)"
            mmdc -i "$source" -o "$RUNNER_TEMP/resourcera-diagrams/$name.png" -c diagrams/mermaid-config.json -p diagrams/ci-puppeteer.json -b white -s 2
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
      - run: uv build
      - run: uv run --locked --group package twine check dist/*.whl dist/*.tar.gz
      - run: uv run --locked python scripts/check_distributions.py dist/*.whl dist/*.tar.gz
      - run: uv venv --seed --python 3.12 "$RUNNER_TEMP/clean-env"
      - run: uv pip install --python "$RUNNER_TEMP/clean-env/bin/python" dist/*.whl
      - run: |
          "$RUNNER_TEMP/clean-env/bin/python" -m pip check
          "$RUNNER_TEMP/clean-env/bin/python" -I -c "import importlib.util, resourcera; assert importlib.util.find_spec('pynvml') is None; print(resourcera.__version__)"
